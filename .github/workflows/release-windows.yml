name: Build Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn

      - run: yarn install --frozen-lockfile
      - run: yarn typecheck
      - run: yarn build
      - run: yarn electron-builder --win nsis --x64 --publish never

      - name: Verify tag and package version
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          $expectedTag = "v$packageVersion"
          if ("${{ github.ref_name }}" -ne $expectedTag) {
            throw "Tag ${{ github.ref_name }} does not match package version $packageVersion."
          }

      - name: Generate checksum
        shell: pwsh
        run: |
          Get-FileHash release\MONBLAN-Setup-*.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $($_.Path | Split-Path -Leaf)" } |
            Set-Content release\SHA256SUMS.txt

      - name: Upload workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: MONBLAN-Windows
          path: |
            release/MONBLAN-Setup-*.exe
            release/SHA256SUMS.txt

      - name: Create draft release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $flags = @("--draft", "--verify-tag")
          if ("${{ github.ref_name }}" -match "alpha|beta|rc") {
            $flags += "--prerelease"
          }
          gh release create "${{ github.ref_name }}" `
            release\MONBLAN-Setup-*.exe `
            release\SHA256SUMS.txt `
            --generate-notes @flags
